<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 380px; margin: 0; padding: 12px; background: #1b1a2b; color: #eee; font: 13px system-ui, sans-serif; }
    h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .muted { color: #999; }
    .status { margin-bottom: 8px; }
    .warn { color: #ffb86b; }
    .job { padding: 6px 0; border-top: 1px solid #2d2b45; }
    .top { display: flex; justify-content: space-between; gap: 8px; }
    .label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 4px; background: #2d2b45; border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .bar div { height: 100%; background: #7b5bf5; }
    .done .bar div { background: #3ecf8e; }
    .failed .bar div { background: #e5484d; }
    button { background: #2d2b45; color: #fff; border: 1px solid #44406a; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    button:hover { background: #7b5bf5; }
    .x { background: none; border: none; color: #999; padding: 0 2px; }
    .footer { margin-top: 10px; display: flex; gap: 6px; }
  </style>
</head>
<body>
  <h3>Stremio Prefetch <span class="muted" id="ver"></span></h3>
  <div class="status" id="status">Connecting…</div>
  <div id="jobs"></div>
  <div class="footer">
    <button id="clear">Clear finished</button>
    <button id="options">Settings</button>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
